        <div class="logo">
            <a href="index.html">
                <img src="assets/img/logitaso_nav.png" alt="Logo de mi empresa">
            </a>

        <ul class="barra-navegacion-lista" id="barra-navegacion-lista">
            <li class="barra-navegacion-item"><a href="catalogo.html" class="barra-navegacion-itemlink">Catálogo</a></li>
            <li class="barra-navegacion-item"><a href="contacto.html" class="barra-navegacion-itemlink">Contacto</a></li>
            <li class="barra-navegacion-item"><a href="mi_cuenta.html" class="barra-navegacion-itemlink">Mi cuenta</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Abrir menú">
            <span class="hamburguer-bar"></span>
            <span class="hamburguer-bar"></span>
            <span class="hamburguer-bar"></span>
        </button>
    </nav>
</header>

<main class="contacto-seccion">
    <section class="contacto-columna-izquierda">
        <h1>¡Contactanos!</h1>
        <img src="assets\img\Contactanos.png" alt="Ilustración de contacto" class="contacto_imagen">
    </section>

    <section class="contacto-columna-derecha">
        <form class="contactoForm">
            <label>Nombres: <input type="text" name="Nombre" required /></label><br><br>
            <label>Apellidos: <input type="text" name="Apellido" required /></label>
            <br><br>
            <label>Email: <input type="text" name="Email" style="color: black;" required></label>
            <br><br>
            <label>Fecha de nacimiento: <input type="date" name="bday" min="1920-01-01" required></label><br><br>
    
            <p>Genero:</p>
            <select name="Genero" id="Genero-seleccion">
                <option value="otro" required>Otro</option>
                <option value="hombre" required>Hombre</option>
                <option value="mujer" required>Mujer</option>
            </select><br><br>
    
            <p>Titulo</p>
            <input type="text" name="titulo" required id="titulo-input"><br><br>
    
    
            <p>Descripcion</p>
            <textarea name="mensaje" rows="10" cols="50" required>
            </textarea>
    
            <br><br>
            <input type="submit" value="Enviar" class="boton-formulario">
            <br><br>
            <input type="reset" value="Reestablecer todo" class="boton-formulario">

        </form>

    </section>

</main>
