<form id="contactoForm" style="text-align: center; padding-top: 50px;">
  <label>Nombres: <input type="text" name="Nombre" required/></label><br><br>
  <label>Apellidos: <input type="text" name="Apellido" required/></label>
  <br><br>
  Email:
  <input type="text" name="Email" style="color: black;" required>
	<br><br>
  Fecha de nacimiento
  <input type="date" name="bday" min="1920-01-01" required><br><br>

<select name="Genero" id="Genero-seleccion">
  <option value="" required>--Cual es tu genero?--</option>
  <option value="dog" required>Hombre</option>
  <option value="cat" required>Mujer</option>
  <option value="hamster" required>Otro</option>
</select><br><br>


    <p>Titulo</p>
<textarea name="mensaje" rows="3" cols="20" required>
</textarea><br><br>

<p>Descripcion</p>
<textarea name="mensaje" rows="10" cols="50" required>
</textarea>

<br><br><input type="submit" value="Enviar" style="font-family: 'Inter', sans-serif;"> <br><br><input type="reset" style="font-family: 'Inter', sans-serif;">

</form>
